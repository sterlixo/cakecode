<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- cakecode // deep grid -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05040a"/>
      <stop offset="50%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#04120f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce6b0" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#5ce6b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4aa8ff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#4aa8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#5ce6b0" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <filter id="b"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <ellipse cx="480" cy="300" rx="620" ry="480" fill="url(#glow)" filter="url(#b)"/>
  <ellipse cx="1500" cy="820" rx="700" ry="520" fill="url(#glow2)" filter="url(#b)"/>
  <g stroke="#5ce6b0" stroke-opacity=".22" fill="none" stroke-width="1.2">
    <path d="M0 760 L480 620 L960 760 L1440 620 L1920 760"/>
    <path d="M0 860 L480 720 L960 860 L1440 720 L1920 860"/>
    <path d="M0 960 L480 820 L960 960 L1440 820 L1920 960"/>
  </g>
  <rect width="1920" height="1080" fill="#000" opacity=".18"/>
</svg>
