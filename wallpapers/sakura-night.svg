<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- cakecode // sakura night, generated wallpaper -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06040c"/>
      <stop offset="38%" stop-color="#160d28"/>
      <stop offset="66%" stop-color="#3c1240"/>
      <stop offset="100%" stop-color="#7a1f52"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9f4" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#ffb3d4" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ff6f9f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6f9f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff6f9f" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#07050f"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#251338"/>
      <stop offset="100%" stop-color="#0a0614"/>
    </linearGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffe9f4" opacity=".55">
    <circle cx="180" cy="120" r="1.6"/><circle cx="420" cy="70" r="1.2"/>
    <circle cx="700" cy="150" r="1.8"/><circle cx="980" cy="90" r="1.3"/>
    <circle cx="1240" cy="180" r="1.5"/><circle cx="1520" cy="110" r="1.2"/>
    <circle cx="1760" cy="200" r="1.7"/><circle cx="300" cy="260" r="1"/>
    <circle cx="860" cy="300" r="1.1"/><circle cx="1420" cy="280" r="1"/>
    <circle cx="1650" cy="60" r="1.4"/><circle cx="120" cy="330" r="1"/>
    <circle cx="1080" cy="230" r="1.2"/><circle cx="560" cy="200" r="1"/>
  </g>

  <!-- moon -->
  <circle cx="1480" cy="235" r="230" fill="url(#moon)"/>
  <circle cx="1480" cy="235" r="74" fill="#fff3f9" opacity=".92" filter="url(#bloom)"/>

  <!-- far skyline -->
  <g fill="url(#bldg)" opacity=".85">
    <rect x="60" y="640" width="110" height="440"/>
    <rect x="190" y="700" width="80" height="380"/>
    <rect x="300" y="600" width="130" height="480"/>
    <rect x="450" y="690" width="90" height="390"/>
    <rect x="560" y="560" width="150" height="520"/>
    <rect x="730" y="660" width="100" height="420"/>
    <rect x="850" y="620" width="120" height="460"/>
    <rect x="990" y="720" width="80" height="360"/>
    <rect x="1090" y="580" width="140" height="500"/>
    <rect x="1250" y="680" width="100" height="400"/>
    <rect x="1370" y="620" width="130" height="460"/>
    <rect x="1520" y="700" width="90" height="380"/>
    <rect x="1630" y="640" width="140" height="440"/>
    <rect x="1790" y="710" width="110" height="370"/>
  </g>

  <!-- near skyline -->
  <g fill="url(#bldg2)">
    <rect x="-40" y="790" width="220" height="330"/>
    <rect x="200" y="750" width="180" height="370"/>
    <rect x="400" y="830" width="160" height="290"/>
    <rect x="580" y="700" width="200" height="420"/>
    <rect x="800" y="800" width="170" height="320"/>
    <rect x="990" y="740" width="210" height="380"/>
    <rect x="1220" y="820" width="160" height="300"/>
    <rect x="1400" y="760" width="200" height="360"/>
    <rect x="1620" y="810" width="180" height="310"/>
    <rect x="1820" y="740" width="160" height="380"/>
  </g>

  <!-- windows -->
  <g fill="#ffd9ec" opacity=".72">
    <rect x="20" y="820" width="10" height="14"/><rect x="52" y="820" width="10" height="14"/>
    <rect x="20" y="860" width="10" height="14"/><rect x="84" y="860" width="10" height="14"/>
    <rect x="240" y="790" width="10" height="14"/><rect x="272" y="830" width="10" height="14"/>
    <rect x="304" y="790" width="10" height="14"/><rect x="240" y="880" width="10" height="14"/>
    <rect x="620" y="740" width="12" height="16"/><rect x="660" y="780" width="12" height="16"/>
    <rect x="700" y="740" width="12" height="16"/><rect x="620" y="830" width="12" height="16"/>
    <rect x="1040" y="780" width="12" height="16"/><rect x="1080" y="820" width="12" height="16"/>
    <rect x="1120" y="780" width="12" height="16"/><rect x="1160" y="860" width="12" height="16"/>
    <rect x="1440" y="800" width="12" height="16"/><rect x="1480" y="840" width="12" height="16"/>
    <rect x="1520" y="800" width="12" height="16"/><rect x="1560" y="880" width="12" height="16"/>
  </g>
  <g fill="#8ce0ff" opacity=".5">
    <rect x="330" y="880" width="10" height="14"/><rect x="366" y="920" width="10" height="14"/>
    <rect x="880" y="860" width="10" height="14"/><rect x="916" y="900" width="10" height="14"/>
    <rect x="1290" y="880" width="10" height="14"/><rect x="1670" y="870" width="10" height="14"/>
    <rect x="1706" y="910" width="10" height="14"/>
  </g>

  <!-- neon signs -->
  <g filter="url(#bloom)">
    <rect x="470" y="742" width="26" height="150" fill="#ff5e96" opacity=".8"/>
    <rect x="900" y="770" width="20" height="120" fill="#8ce0ff" opacity=".7"/>
    <rect x="1530" y="752" width="22" height="140" fill="#c77dff" opacity=".8"/>
  </g>

  <!-- ground haze -->
  <rect y="820" width="1920" height="260" fill="url(#haze)" filter="url(#soft)"/>

  <!-- petals -->
  <g fill="#ffc2d6" opacity=".8" filter="url(#soft)">
    <ellipse cx="220" cy="420" rx="7" ry="4" transform="rotate(24 220 420)"/>
    <ellipse cx="560" cy="300" rx="6" ry="3.5" transform="rotate(-18 560 300)"/>
    <ellipse cx="880" cy="470" rx="8" ry="4.5" transform="rotate(40 880 470)"/>
    <ellipse cx="1180" cy="360" rx="6" ry="3.5" transform="rotate(-30 1180 360)"/>
    <ellipse cx="1420" cy="520" rx="7" ry="4" transform="rotate(16 1420 520)"/>
    <ellipse cx="1700" cy="400" rx="6" ry="3.5" transform="rotate(-12 1700 400)"/>
    <ellipse cx="360" cy="620" rx="8" ry="4.5" transform="rotate(30 360 620)"/>
    <ellipse cx="1020" cy="640" rx="7" ry="4" transform="rotate(-40 1020 640)"/>
    <ellipse cx="1560" cy="660" rx="6" ry="3.5" transform="rotate(22 1560 660)"/>
  </g>

  <!-- grain -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".05"/>
  <rect width="1920" height="1080" fill="#000" opacity=".12"/>
</svg>
